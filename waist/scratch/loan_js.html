<script>
const loanData = {
    "Secured Loans": ["Home Loan", "Loan Against Property (LAP)", "Commercial Property Purchase", "Balance Transfer & Top Up", "Lease Rental Discounting (LRD)", "Construction Finance"],
    "Unsecured Loans": ["Business Loan", "Personal Loan", "Professional Loan (Doctor/CA/CS)"],
    "Working Capital": ["Cash Credit (CC)", "Overdraft (OD)", "Dropline OD (DLOD)", "Export Finance", "LC / BG / SBLC", "CGTMSE Loans", "Mudhra Loans", "PMEGP Loans"],
    "Project Finance": ["Machinery Loan", "Equipment Finance", "Medical Equipment Finance", "Infrastructure Finance"]
};

function updateSubTypes() {
    const typeSelect = document.getElementById('loan_type');
    const subTypeSelect = document.getElementById('loan_sub_type');
    
    subTypeSelect.innerHTML = '<option value="">-- Select Sub Type --</option>';
    
    const selectedType = typeSelect.value;
    if (selectedType && loanData[selectedType]) {
        loanData[selectedType].forEach(subType => {
            const option = document.createElement('option');
            option.value = subType;
            option.textContent = subType;
            subTypeSelect.appendChild(option);
        });
    }
}
</script>
